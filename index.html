<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Restoration</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  text-align: center;
  color: #222;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 { font-size: 2.2em; }
h2 { margin-top: 50px; }

/* HERO */
.hero {
  background: white;
  padding: 50px 20px;
}

.cta {
  background: #007bff;
  color: white;
  padding: 15px 25px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-block;
  margin: 15px 0;
  font-weight: bold;
}

/* SLIDER */
.slider-container {
  max-width: 650px;
  margin: 50px auto;
}

.slider-wrapper {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.slider-image {
  width: 100%;
  display: block;
}

/* BEFORE overlay */
.slider-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  overflow: hidden;
}

/* HANDLE */
.slider-handle {
  position: absolute;
  top: 0;
  left: 50%;
  width: 3px;
  height: 100%;
  background: white;
  cursor: ew-resize;
  z-index: 10;
}

.slider-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: -11px;
  width: 22px;
  height: 22px;
  background: #007bff;
  border-radius: 50%;
  transform: translateY(-50%);
}

/* LABELS */
.label {
  position: absolute;
  top: 12px;
  background: rgba(0,0,0,0.65);
  color: white;
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 5px;
}

.before-label { left: 10px; }
.after-label { right: 10px; }

.footer {
  background: #222;
  color: white;
  padding: 20px;
  margin-top: 40px;
}
</style>
</head>

<body>

<div class="hero">
  <div class="container">
    <h1>Bring Your Old Photos Back to Life</h1>
    <p>Professional restoration with a FREE preview</p>
    <a href="#" class="cta">Upload Your Photo – FREE Preview</a>
  </div>
</div>

<div class="container">
  <h2>See the Difference</h2>

  <div class="slider-container">
    <div class="slider-wrapper">

      <!-- AFTER (revealed image underneath) -->
      <img src="after1.jpg" class="slider-image">

      <!-- BEFORE (overlay that gets removed) -->
      <div class="slider-overlay">
        <img src="before1.jpg" class="slider-image">
      </div>

      <div class="slider-handle"></div>

      <div class="label before-label">BEFORE</div>
      <div class="label after-label">AFTER</div>

    </div>
  </div>

</div>

<div class="footer">
  <p>© 2026 Preserve Your Memories</p>
</div>

<script>
document.querySelectorAll(".slider-wrapper").forEach(wrapper => {

  const overlay = wrapper.querySelector(".slider-overlay");
  const handle = wrapper.querySelector(".slider-handle");

  let isDragging = false;

  let target = 50;
  let current = 50;

  // SMOOTH ANIMATION (slower movement)
  function animate() {
    current += (target - current) * 0.05; // smaller = slower

    overlay.style.width = current + "%";
    handle.style.left = current + "%";

    requestAnimationFrame(animate);
  }

  animate();

  // DESKTOP
  handle.addEventListener("mousedown", () => isDragging = true);
  window.addEventListener("mouseup", () => isDragging = false);

  window.addEventListener("mousemove", (e) => {
    if (!isDragging) return;

    const rect = wrapper.getBoundingClientRect();
    let x = e.clientX - rect.left;

    x = Math.max(0, Math.min(x, rect.width));
    target = (x / rect.width) * 100;
  });

  // MOBILE
  handle.addEventListener("touchstart", () => isDragging = true);
  window.addEventListener("touchend", () => isDragging = false);

  window.addEventListener("touchmove", (e) => {
    if (!isDragging) return;

    const rect = wrapper.getBoundingClientRect();
    let x = e.touches[0].clientX - rect.left;

    x = Math.max(0, Math.min(x, rect.width));
    target = (x / rect.width) * 100;
  });

});
</script>

</body>
</html>
