<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Restoration</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
  text-align: center;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* HERO */
.hero {
  background: white;
  padding: 50px 20px;
}

.cta {
  background: #007bff;
  color: white;
  padding: 14px 28px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-block;
  margin-top: 15px;
  font-weight: bold;
}

/* ===== SLIDER ===== */
.slider-container {
  max-width: 700px;
  margin: 50px auto;
}

.slider-wrapper {
  position: relative;
  width: 100%;
  height: 400px; /* fixed height = no shrink */
  overflow: hidden;
  border-radius: 10px;
}

.slider-wrapper img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* AFTER (revealed underneath) */
.after-img {
  z-index: 1;
}

/* BEFORE overlay */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 100%;
  overflow: hidden;
  z-index: 2;
}

/* HANDLE */
.handle {
  position: absolute;
  top: 0;
  left: 50%;
  width: 3px;
  height: 100%;
  background: white;
  z-index: 3;
  cursor: ew-resize;
}

.handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: -10px;
  width: 20px;
  height: 20px;
  background: #007bff;
  border-radius: 50%;
  transform: translateY(-50%);
}

/* LABELS */
.label {
  position: absolute;
  top: 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 5px 10px;
  font-size: 12px;
  border-radius: 5px;
  z-index: 4;
}

.before { left: 10px; }
.after { right: 10px; }

/* ===== UPLOAD SECTION ===== */
.upload-card {
  max-width: 500px;
  margin: 50px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.upload-box {
  border: 2px dashed #ccc;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 8px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 14px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

.footer {
  margin-top: 50px;
  padding: 20px;
  background: #222;
  color: white;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="container">
    <h1>Bring Your Old Photos Back to Life</h1>
    <p>Professional restoration with a FREE preview before you pay</p>
    <a href="#upload" class="cta">Upload Your Photo – FREE Preview</a>
  </div>
</div>

<!-- SLIDER -->
<div class="container">
  <h2>See the Difference</h2>

  <div class="slider-container">
    <div class="slider-wrapper" id="slider">

      <img src="after1.jpg" class="after-img">

      <div class="overlay" id="overlay">
        <img src="before1.jpg">
      </div>

      <div class="handle" id="handle"></div>

      <div class="label before">BEFORE</div>
      <div class="label after">AFTER</div>

    </div>
  </div>
</div>

<!-- UPLOAD -->
<div class="upload-card" id="upload">
  <h2>Upload Your Photo</h2>

  <div class="upload-box">
    <input type="file">
  </div>

  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">

  <button>Submit Request</button>
</div>

<div class="footer">
  <p>© 2026 Preserve Your Memories</p>
</div>

<script>
const slider = document.getElementById("slider");
const overlay = document.getElementById("overlay");
const handle = document.getElementById("handle");

let isDragging = false;
let percent = 50;

// DRAG START
slider.addEventListener("mousedown", () => isDragging = true);
window.addEventListener("mouseup", () => isDragging = false);

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  const rect = slider.getBoundingClientRect();
  let x = e.clientX - rect.left;

  x = Math.max(0, Math.min(x, rect.width));
  percent = (x / rect.width) * 100;

  overlay.style.width = percent + "%";
  handle.style.left = percent + "%";
});

// TOUCH
slider.addEventListener("touchstart", () => isDragging = true);
window.addEventListener("touchend", () => isDragging = false);

window.addEventListener("touchmove", (e) => {
  if (!isDragging) return;

  const rect = slider.getBoundingClientRect();
  let x = e.touches[0].clientX - rect.left;

  x = Math.max(0, Math.min(x, rect.width));
  percent = (x / rect.width) * 100;

  overlay.style.width = percent + "%";
  handle.style.left = percent + "%";
});
</script>

</body>
</html>
