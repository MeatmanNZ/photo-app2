<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Restoration – Free Preview</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

/* HERO */
.hero {
  background: white;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 2.4em;
}

.cta {
  background: #007bff;
  color: white;
  padding: 14px 28px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-block;
  margin-top: 20px;
  font-weight: bold;
}

/* ===== SLIDER ===== */
.slider-container {
  max-width: 750px;
  margin: 60px auto;
}

.slider-wrapper {
  position: relative;
  width: 100%;
  height: 420px;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

/* Images fill perfectly */
.slider-wrapper img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* BEFORE layer (top) */
.before-layer {
  position: absolute;
  width: 100%;
  height: 100%;
  clip-path: inset(0 50% 0 0); /* this is the magic */
  z-index: 2;
}

/* HANDLE */
.handle {
  position: absolute;
  top: 0;
  left: 50%;
  width: 3px;
  height: 100%;
  background: white;
  z-index: 3;
  cursor: ew-resize;
}

.handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: -10px;
  width: 20px;
  height: 20px;
  background: #007bff;
  border-radius: 50%;
  transform: translateY(-50%);
}

/* LABELS */
.label {
  position: absolute;
  top: 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 6px;
  z-index: 4;
}

.before-label { left: 12px; }
.after-label { right: 12px; }

/* ===== PRICING ===== */
.pricing {
  background: white;
  padding: 50px 20px;
  margin-top: 40px;
}

.price-box {
  background: #f9fbff;
  padding: 30px;
  border-radius: 12px;
  display: inline-block;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.price-box h3 {
  margin: 0;
  font-size: 1.8em;
}

/* ===== UPLOAD ===== */
.upload-card {
  max-width: 520px;
  margin: 50px auto;
  background: white;
  padding: 35px;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.1);
}

.upload-box {
  border: 2px dashed #ccc;
  padding: 25px;
  margin-bottom: 20px;
  border-radius: 10px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 16px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

.footer {
  margin-top: 60px;
  padding: 20px;
  background: #222;
  color: white;
  text-align: center;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="container">
    <h1>Bring Your Old Photos Back to Life</h1>
    <p>Professional restoration with a FREE preview before you pay</p>
    <a href="#upload" class="cta">Upload Your Photo – FREE Preview</a>
  </div>
</div>

<!-- SLIDER -->
<div class="container">
  <h2>See the Difference</h2>

  <div class="slider-container">
    <div class="slider-wrapper" id="slider">

      <!-- AFTER -->
      <img src="after1.jpg">

      <!-- BEFORE -->
      <div class="before-layer" id="beforeLayer">
        <img src="before1.jpg">
      </div>

      <div class="handle" id="handle"></div>

      <div class="label before-label">BEFORE</div>
      <div class="label after-label">AFTER</div>

    </div>
  </div>
</div>

<!-- PRICING -->
<div class="pricing">
  <div class="container">
    <h2>Simple Pricing</h2>
    <div class="price-box">
      <h3>$10 – $50 NZD</h3>
      <p>Depending on damage</p>
      <p><strong>FREE preview before payment</strong></p>
    </div>
  </div>
</div>

<!-- UPLOAD -->
<div class="upload-card" id="upload">
  <h2>Upload Your Photo</h2>

  <div class="upload-box">
    <input type="file">
  </div>

  <input type="text" placeholder="Your Name">
  <input type="email" placeholder="Your Email">

  <button>Submit Request</button>
</div>

<div class="footer">
  <p>© 2026 Preserve Your Memories</p>
</div>

<script>
const slider = document.getElementById("slider");
const beforeLayer = document.getElementById("beforeLayer");
const handle = document.getElementById("handle");

let isDragging = false;

slider.addEventListener("mousedown", () => isDragging = true);
window.addEventListener("mouseup", () => isDragging = false);

window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;

  const rect = slider.getBoundingClientRect();
  let x = e.clientX - rect.left;

  x = Math.max(0, Math.min(x, rect.width));
  const percent = (x / rect.width) * 100;

  beforeLayer.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
  handle.style.left = percent + "%";
});

/* mobile */
slider.addEventListener("touchstart", () => isDragging = true);
window.addEventListener("touchend", () => isDragging = false);

window.addEventListener("touchmove", (e) => {
  if (!isDragging) return;

  const rect = slider.getBoundingClientRect();
  let x = e.touches[0].clientX - rect.left;

  x = Math.max(0, Math.min(x, rect.width));
  const percent = (x / rect.width) * 100;

  beforeLayer.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
  handle.style.left = percent + "%";
});
</script>

</body>
</html>
